name: Deploy na GitHub Pages

on:
  push:
    branches:
      - claude/cycling-training-project-43qg6i
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # bramka jakości: build musi przejść smoke test w headless Chromium
      # (start appki bez błędów strony, hero + nawigacja na miejscu),
      # inaczej zepsuta wersja nie trafi na produkcję
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
